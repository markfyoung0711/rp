[project]
name = "outreach-bot"
version = "0.1.0"
description = "Context-aware leasing outreach decision bot (RealPage take-home)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6",
    "tzdata>=2024.1",   # time-zone data on machines without it (e.g. Windows)
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
