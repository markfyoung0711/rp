# Decision rules for the outreach bot.
# Change behavior here, not in code. Every table has a `default` row that is used for
# values we have never seen (Level 1: same shape, new values).

channels:
  supported: [sms, email, voice]  # voice = an automated call script with keypad options (shape inferred; the samples show no voice answer)
  default_order: [sms, email]     # used when a record has no channel_preferences
  aliases: {text: sms, texting: sms, sms_text: sms, mobile: sms, e-mail: email, mail: email, phone: voice, call: voice, calls: voice}
  send_hour:                      # local hour; SMS 09:00 and email 10:00 inferred from the samples; voice assumed
    sms: 9
    email: 10
    voice: 10
    default: 10
  legal_window: [8, 21]           # never send outside 08:00-21:00 recipient local time

send_time:
  # Day offset: taken from `dayN` in the task_id; otherwise from the stage table below.
  stage_default_offset_days:
    new: 0
    open: 3
    default: 1

next_action:
  new_stages: [new]                # these start a cadence; everyone else gets a follow-up
  horizon_threshold_days: 45       # days from send date to move date: <= short, > long
  follow_up_days: 3
  follow_up_days_without_dayN: 2   # when the task_id has no dayN; the input's follow_up_days or the property's setting wins
  follow_up_days_by_stage:         # per record type (lifecycle_stage), from the hold-out; checked before dayN
    welcome: 2
    cancelled_manager: 2
    loyalty_engage: 5

stop_keywords: [STOP, STOPALL, UNSUBSCRIBE, CANCEL, END, QUIT, OPTOUT, "OPT OUT", REVOKE]
# Each language's own STOP keywords, protected terms and banned phrases live in config/templates/<lang>.yaml
# and are added to these lists when the rules load.

# Used when a record has no primary_cta.
default_cta_by_persona:
  prospect: book_tour
  applicant: apply_now
  default: general

# primary_cta -> output cta.type, purpose and the facts key holding its link.
cta:
  book_tour:            {type: schedule_tour,        purpose: tour,        link_key: tour_link}
  schedule_tour:        {type: schedule_tour,        purpose: tour,        link_key: tour_link}
  apply_now:            {type: start_application,    purpose: apply,       link_key: apply_link}
  start_application:    {type: start_application,    purpose: apply,       link_key: apply_link}
  sign_lease:           {type: sign_lease,           purpose: sign_lease,  link_key: portal_link}
  collect_deposit:      {type: pay_deposit,          purpose: payment,     link_key: portal_link}
  pay_deposit:          {type: pay_deposit,          purpose: payment,     link_key: portal_link}
  pay_rent:             {type: pay_rent,             purpose: payment,     link_key: portal_link}
  renew_lease:          {type: renew_lease,          purpose: renewal,     link_key: portal_link}
  schedule_maintenance: {type: schedule_maintenance, purpose: maintenance, link_key: portal_link}
  general:              {type: contact_us,           purpose: general,     link_key: contact_link}
  default:              {type: contact_us,           purpose: general,     link_key: contact_link}

# Profile keys the message writer may use. Everything else in the profile is withheld
# (it may contain protected-class details: family, religion, disability, ...).
profile_allow_list: [first_name, amenity_interest, city_interest, unit_interest, bedrooms]

# Words that must never appear in an outgoing message (fair housing).
protected_terms: [kid, kids, child, children, baby, babies, pregnan, family size, familial,
  religio, church, mosque, synagogue, temple, christian, muslim, jewish, disab, wheelchair,
  handicap, race, racial, ethnic, national origin, immigra, nationality, citizenship,
  gender, sexual orientation, married, single mom, single dad, elderly, senior, retiree,
  famil, adults only, adult only, no kids, couples, singles, young professionals, empty nester]

# Brand style (the samples' required state "brand_style_applied"). The default applies to any property
# without its own `brand` block in properties.yaml; a property's block overrides these keys.
brand_default:
  emoji_allowed: false
  max_exclamations: 2          # per message
  max_sms_chars: 320           # two SMS segments
  shouting_allowed: false      # no ALL-CAPS words (STOP, SMS, CTA codes and short acronyms excepted)
  use_display_name: true       # say "Oak Ridge", not "Oak Ridge Apartments", when a display name exists
  max_voice_words: 75          # a call script of about 30 seconds
  banned_phrases: [act now, limited time, hurry, don't miss out, guaranteed, best deal, cheap, urgent,
                   last chance, exclusive offer, click here now, luxury living at its finest]

# For properties with no facts file: derive the short display name the samples use ("Oak Ridge", not
# "Oak Ridge Apartments") by dropping one of these trailing words.
display_name_suffixes: [apartment homes, apartments, apts, residences, homes, townhomes, townhouses, lofts, flats,
                        community, communities]

# Language used when the recipient's language has no template and the property sets no default_language.
default_language: en

